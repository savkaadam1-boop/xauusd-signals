name: Optimalizacia

on:
  workflow_dispatch:

jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalacia kniznic
        run: pip install --quiet yfinance pandas numpy requests
      - name: Optimalizacia
        run: python optimize.py
